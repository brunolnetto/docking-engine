[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docking-engine"
version = "0.1.0"
description = "A reproducible molecular docking execution model"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "boto3>=1.35,<2",
    "coverage[toml]>=7.6",
    "duckdb>=1.5.5,<1.6",
    "pytz>=2024.1",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "reportlab>=4.2,<5",
]
ducklake = [
    "duckdb>=1.5.5,<1.6",
    "pytz>=2024.1",
]
meeko = [
    "meeko>=0.8,<0.9",
]
pdf = [
    "reportlab>=5,<6",
]
rustfs = [
    "boto3>=1.35,<2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-config --strict-markers"
markers = [
    "real_e2e: requires local Meeko 0.8.x and AutoDock Vina 1.2.7 executables",
]

[tool.coverage.run]
branch = true
source = ["moldock"]

[tool.coverage.report]
fail_under = 95
precision = 2
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.html]
directory = "htmlcov"
