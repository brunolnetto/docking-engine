name: Pose Analysis Real Smoke

on:
  push:
    branches:
      - automation/pose-analysis-real-smoke

permissions:
  contents: read

jobs:
  real-pose-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install project and real toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,pdf]"
          python -m pip install "meeko==0.8.0" rdkit scipy gemmi
          sudo curl -fsSL -o /usr/local/bin/vina \
            https://github.com/ccsb-scripps/AutoDock-Vina/releases/download/v1.2.7/vina_1.2.7_linux_x86_64
          sudo chmod +x /usr/local/bin/vina
      - name: Run real pipeline with pose analysis
        run: |
          python examples/real_vina_report.py \
            --workspace .moldock/pose-analysis \
            --run-id 1iep-pose-analysis \
            --pdf
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path(".moldock/pose-analysis/reports/1iep-pose-analysis.json")
          payload = json.loads(p.read_text())
          task = payload["tasks"][0]
          metrics = task["metrics"]
          clusters = task["clusters"]
          print("metrics", len(metrics))
          print("clusters", len(clusters))
          print(json.dumps(metrics, indent=2))
          assert any(x["kind"] == "rmsd_to_rank1" for x in metrics)
          assert any(x["kind"] == "ligand_efficiency" for x in metrics)
          assert len(clusters) >= 1
          PY
      - name: Run pose analysis tests
        run: |
          python -m pytest tests/results/test_pose_analysis.py tests/results/test_interpreter.py tests/reporting -q
      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: 1iep-pose-analysis-report
          path: .moldock/pose-analysis/reports/
          retention-days: 7
