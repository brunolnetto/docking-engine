name: ReportLab Real PDF Smoke

on:
  push:
    branches:
      - automation/reportlab-real-smoke

permissions:
  contents: read

jobs:
  pdf-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install project and real toolchain dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,pdf]"
          python -m pip install "meeko==0.8.0" rdkit scipy gemmi
          sudo curl -fsSL \
            -o /usr/local/bin/vina \
            https://github.com/ccsb-scripps/AutoDock-Vina/releases/download/v1.2.7/vina_1.2.7_linux_x86_64
          sudo chmod +x /usr/local/bin/vina

      - name: Run real pipeline and PDF report
        run: |
          python examples/real_vina_report.py \
            --workspace .moldock/reportlab \
            --run-id 1iep-vina-reportlab \
            --pdf
          test -s .moldock/reportlab/reports/1iep-vina-reportlab.pdf
          file .moldock/reportlab/reports/1iep-vina-reportlab.pdf

      - name: Run PDF reporting tests
        run: |
          python -m pytest tests/reporting/test_pipeline_report.py -q

      - name: Upload generated report
        uses: actions/upload-artifact@v7
        with:
          name: 1iep-vina-reportlab
          path: .moldock/reportlab/reports/
          retention-days: 7
