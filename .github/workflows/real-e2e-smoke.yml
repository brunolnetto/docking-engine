name: Real Vina E2E Smoke

on:
  push:
    branches:
      - automation/real-e2e-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and Meeko
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "meeko==0.8.0" "rdkit"

      - name: Install AutoDock Vina 1.2.7
        run: |
          sudo curl -fsSL \
            -o /usr/local/bin/vina \
            https://github.com/ccsb-scripps/AutoDock-Vina/releases/download/v1.2.7/vina_1.2.7_linux_x86_64
          sudo chmod +x /usr/local/bin/vina
          vina --version

      - name: Show real toolchain
        run: |
          which vina
          which mk_prepare_ligand.py
          which mk_prepare_receptor.py
          vina --version
          head -n 1 "$(which mk_prepare_ligand.py)"
          head -n 1 "$(which mk_prepare_receptor.py)"
          python - <<'PY'
          from importlib.metadata import version
          print("Meeko", version("meeko"))
          PY

      - name: Run real opt-in E2E
        env:
          MOLDOCK_RUN_REAL_E2E: "1"
        run: |
          python -m pytest tests/integration/test_real_vina_e2e.py -vv -s

      - name: Run standalone real report example
        run: |
          rm -rf .moldock/gha-1iep
          python examples/real_vina_report.py \
            --workspace .moldock/gha-1iep \
            --run-id 1iep-vina-gha
          echo "---- Markdown report ----"
          cat .moldock/gha-1iep/reports/1iep-vina-gha.md
          echo "---- JSON report ----"
          cat .moldock/gha-1iep/reports/1iep-vina-gha.json

      - name: Upload real run artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-vina-e2e-output
          path: .moldock/gha-1iep/
          if-no-files-found: warn
          retention-days: 7
